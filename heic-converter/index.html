<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ממיר HEIC ל-JPG — בלי להעלות לשום מקום</title>
<style>
  :root {
    --bg: #0f1115;
    --card: #191c23;
    --accent: #4f9cf9;
    --accent-hover: #6db0ff;
    --text: #e8eaf0;
    --muted: #9aa3b2;
    --ok: #3dd68c;
    --err: #f06a6a;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, "Segoe UI", Roboto, "Heebo", Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 24px 16px 60px;
  }
  header { text-align: center; margin: 24px 0 8px; max-width: 640px; }
  h1 { font-size: 1.6rem; margin-bottom: 8px; }
  .privacy {
    color: var(--muted);
    font-size: 0.95rem;
    line-height: 1.6;
  }
  .privacy b { color: var(--ok); }
  #drop {
    margin-top: 28px;
    width: 100%;
    max-width: 640px;
    border: 2px dashed #3a4150;
    border-radius: 16px;
    background: var(--card);
    padding: 48px 24px;
    text-align: center;
    cursor: pointer;
    transition: border-color .15s, background .15s;
  }
  #drop.drag { border-color: var(--accent); background: #1d2330; }
  #drop p { color: var(--muted); margin-top: 8px; font-size: 0.9rem; }
  #drop .big { font-size: 1.15rem; color: var(--text); }
  input[type=file] { display: none; }
  #list { width: 100%; max-width: 640px; margin-top: 20px; }
  .item {
    background: var(--card);
    border-radius: 12px;
    padding: 12px 16px;
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 10px;
  }
  .item img { width: 48px; height: 48px; object-fit: cover; border-radius: 8px; background:#000; }
  .item .name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 0.95rem; }
  .item .status { font-size: 0.85rem; color: var(--muted); white-space: nowrap; }
  .item .status.ok { color: var(--ok); }
  .item .status.err { color: var(--err); }
  .item a.dl {
    background: var(--accent);
    color: #fff;
    text-decoration: none;
    padding: 8px 14px;
    border-radius: 8px;
    font-size: 0.9rem;
    white-space: nowrap;
  }
  .item a.dl:hover { background: var(--accent-hover); }
  #dlAll {
    display: none;
    margin-top: 12px;
    background: var(--ok);
    color: #08130d;
    border: none;
    font-weight: 700;
    padding: 14px 28px;
    border-radius: 10px;
    font-size: 1rem;
    cursor: pointer;
  }
  #dlAll:hover { filter: brightness(1.1); }
  footer { margin-top: auto; padding-top: 40px; color: var(--muted); font-size: 0.8rem; text-align: center; }
  footer a { color: var(--accent); }
</style>
</head>
<body>
<header>
  <h1>📷 ממיר HEIC ל‑JPG</h1>
  <div class="privacy">
    גררו לכאן תמונות HEIC מהאייפון וקבלו JPG שנפתח בכל מקום.<br>
    <b>הכל קורה בדפדפן שלכם.</b> התמונות לא נשלחות לשום שרת — אפשר אפילו לנתק אינטרנט אחרי שהדף נטען.
  </div>
</header>

<div id="drop">
  <div class="big">גררו קבצים לכאן, או לחצו לבחירה</div>
  <p>אפשר כמה קבצים בבת אחת · HEIC / HEIF</p>
  <input type="file" id="file" multiple accept=".heic,.heif,image/heic,image/heif">
</div>

<div id="list"></div>
<button id="dlAll">⬇️ הורדת הכל (ZIP)</button>

<footer>
  נבנה על ידי סוכן AI · הקוד פתוח · שום מידע לא נאסף
</footer>

<script src="https://cdn.jsdelivr.net/npm/heic2any@0.0.4/dist/heic2any.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
<script>
const drop = document.getElementById('drop');
const fileInput = document.getElementById('file');
const list = document.getElementById('list');
const dlAll = document.getElementById('dlAll');
const results = [];

drop.addEventListener('click', () => fileInput.click());
drop.addEventListener('dragover', e => { e.preventDefault(); drop.classList.add('drag'); });
drop.addEventListener('dragleave', () => drop.classList.remove('drag'));
drop.addEventListener('drop', e => {
  e.preventDefault(); drop.classList.remove('drag');
  handleFiles(e.dataTransfer.files);
});
fileInput.addEventListener('change', () => handleFiles(fileInput.files));

function handleFiles(files) {
  [...files].forEach(convert);
}

async function convert(file) {
  const row = document.createElement('div');
  row.className = 'item';
  row.innerHTML = `<img alt=""><div class="name">${file.name}</div><div class="status">ממיר…</div>`;
  list.appendChild(row);
  const statusEl = row.querySelector('.status');
  try {
    if (!/\.(heic|heif)$/i.test(file.name)) throw new Error('לא קובץ HEIC');
    const blob = await heic2any({ blob: file, toType: 'image/jpeg', quality: 0.92 });
    const jpg = Array.isArray(blob) ? blob[0] : blob;
    const outName = file.name.replace(/\.(heic|heif)$/i, '.jpg');
    const url = URL.createObjectURL(jpg);
    row.querySelector('img').src = url;
    statusEl.textContent = (jpg.size/1024/1024).toFixed(1) + ' MB';
    statusEl.classList.add('ok');
    const a = document.createElement('a');
    a.className = 'dl'; a.href = url; a.download = outName; a.textContent = 'הורדה';
    row.appendChild(a);
    results.push({ name: outName, blob: jpg });
    if (results.length >= 2) dlAll.style.display = 'inline-block';
  } catch (err) {
    statusEl.textContent = 'שגיאה: ' + (err.message || 'המרה נכשלה');
    statusEl.classList.add('err');
  }
}

dlAll.addEventListener('click', async () => {
  dlAll.textContent = 'אורז…';
  const zip = new JSZip();
  results.forEach(r => zip.file(r.name, r.blob));
  const blob = await zip.generateAsync({ type: 'blob' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'converted-photos.zip';
  a.click();
  dlAll.textContent = '⬇️ הורדת הכל (ZIP)';
});
</script>
</body>
</html>
